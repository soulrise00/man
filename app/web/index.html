<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>누끼 자동 처리</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --fg: #e8eaed;
    --muted: #9aa3b2; --accent: #5b9dff; --ok: #3fb950; --warn: #d29922;
    --checker1: #e9e9ee; --checker2: #cfd0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); padding: 24px 16px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 36px 20px;
    text-align: center; background: var(--card); cursor: pointer; transition: .15s;
  }
  .drop.drag { border-color: var(--accent); background: #1b2536; }
  .drop input { display: none; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 12px; }
  select, button, input[type=text] {
    background: #10131a; color: var(--fg); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 12px; font: inherit;
  }
  button.primary { background: var(--accent); color: #06122b; border: none; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel h3 { margin: 0; padding: 10px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); font-weight: 600; }
  .imgbox {
    min-height: 260px; display: flex; align-items: center; justify-content: center; padding: 14px;
    background-image:
      linear-gradient(45deg, var(--checker2) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker2) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker2) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker2) 75%);
    background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; background-color: var(--checker1);
  }
  .imgbox img { max-width: 100%; max-height: 420px; display: block; }
  .imgbox.plain { background: #0b0d12; }
  .meta { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: none; }
  .meta.show { display: block; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .links a { color: var(--accent); margin-right: 14px; }
  .err { color: #ff6b6b; margin-top: 14px; }
  code { background: #10131a; padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>누끼 자동 처리 · Auto Background Removal</h1>
  <p class="sub">사진을 올리면 배경을 자동으로 제거하고 DB에 등록합니다. (엔진: <span id="engine">…</span>)</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" />
    <div><strong>클릭하거나 이미지를 여기에 드래그</strong></div>
    <div style="color:var(--muted);font-size:13px;margin-top:6px">JPG / PNG / WEBP</div>
    <div class="row">
      <input type="text" id="sku" placeholder="외부 ID / SKU (선택)" />
      <select id="model" title="모델">
        <option value="">기본 모델</option>
        <option value="isnet-general-use">isnet-general-use (CPU 권장)</option>
        <option value="birefnet-general">birefnet-general (최고 품질 · GPU)</option>
        <option value="u2net">u2net (최속)</option>
      </select>
      <button class="primary" id="go" disabled>누끼 처리</button>
    </div>
  </label>

  <div class="grid">
    <div class="panel"><h3>원본</h3><div class="imgbox plain" id="box-orig"><span style="color:var(--muted)">—</span></div></div>
    <div class="panel"><h3>누끼 결과 (투명 PNG)</h3><div class="imgbox" id="box-cut"><span style="color:var(--muted)">—</span></div></div>
  </div>

  <div class="meta" id="meta">
    <div class="kv" id="kv"></div>
    <div class="links" id="links" style="margin-top:12px"></div>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const fileEl = $('#file'), drop = $('#drop'), go = $('#go');
let chosen = null;

fetch('/health').then(r => r.json()).then(h => { $('#engine').textContent = h.default_model; })
  .catch(() => { $('#engine').textContent = '(오프라인)'; });

function pick(f) {
  if (!f) return;
  chosen = f; go.disabled = false;
  const url = URL.createObjectURL(f);
  $('#box-orig').innerHTML = `<img src="${url}" alt="original">`;
}
fileEl.addEventListener('change', e => pick(e.target.files[0]));
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

go.addEventListener('click', async e => {
  e.preventDefault();
  if (!chosen) return;
  go.disabled = true; go.textContent = '처리 중…';
  $('#err').textContent = ''; $('#meta').classList.remove('show');
  $('#box-cut').innerHTML = '<span style="color:var(--muted)">처리 중…</span>';

  const fd = new FormData();
  fd.append('file', chosen);
  if ($('#sku').value) fd.append('external_id', $('#sku').value);
  if ($('#model').value) fd.append('model', $('#model').value);

  try {
    const res = await fetch('/api/v1/images', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));

    $('#box-cut').innerHTML = `<img src="${data.cutout_url}" alt="cutout">`;
    const review = data.needs_review
      ? '<span class="badge warn">검토 필요</span>'
      : '<span class="badge ok">정상</span>';
    $('#kv').innerHTML = `
      <div>ID</div><div><code>${data.id}</code></div>
      <div>모델</div><div>${data.model || '-'}</div>
      <div>크기</div><div>${data.width} × ${data.height}</div>
      <div>처리 시간</div><div>${data.processing_ms} ms</div>
      <div>전경 비율</div><div>${(data.foreground_ratio*100).toFixed(1)}% ${review}</div>
      <div>상태</div><div>${data.status}</div>`;
    $('#links').innerHTML = `
      <a href="${data.cutout_url}" target="_blank" download>투명 PNG</a>
      <a href="${data.flat_url}" target="_blank" download>흰 배경 JPG</a>
      <a href="${data.thumbnail_url}" target="_blank">썸네일</a>
      <a href="${data.original_url}" target="_blank">원본</a>`;
    $('#meta').classList.add('show');
  } catch (err) {
    $('#box-cut').innerHTML = '<span style="color:var(--muted)">—</span>';
    $('#err').textContent = '오류: ' + err.message;
  } finally {
    go.disabled = false; go.textContent = '누끼 처리';
  }
});
</script>
</body>
</html>
